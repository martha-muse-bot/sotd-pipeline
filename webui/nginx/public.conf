server {
    listen 80;

    # index.html is the cache-busting root: it must always revalidate so a
    # deploy is picked up on refresh. Assets are content-hashed by Vite, so
    # they can be cached forever.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: deep links like /product-usage must serve index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API proxied to the public-api service on the same compose network
    location /api/ {
        proxy_pass http://sotd-public-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
