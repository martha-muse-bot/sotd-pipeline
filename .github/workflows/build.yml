name: build
on:
  push:
    branches: [master]
    paths:
      - 'webui/**'
      - 'sotd/**'
      - 'requirements.txt'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install python deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff + black check
        run: |
          ruff check sotd webui/api
          black --check sotd webui/api
      - name: Python tests (scoped to CI-verifiable suites)
        run: |
          # --dist loadfile: tests/report/test_annual_range_integration.py writes real
          # files under data/aggregated/annual/ (shared across workers under plain -n auto,
          # causing flaky cross-worker races); loadfile pins a file to one worker.
          # Excluded webui/api suites (data-dependent, run locally where data/ exists):
          #   webui/api/tests/test_validation_router.py (11 tests read data/ rejections/proposals)
          #   webui/api/__tests__/test_wsdb_alignment.py (18 tests read data/ match files)
          #   webui/api/__tests__/test_report_rankings.py::test_report_rankings_series_requires_items
          # Included webui/api suites are tmp_path-based and data-independent.
          PYTHONPATH=. pytest tests/ \
            webui/api/__tests__/test_public_main.py \
            webui/api/__tests__/test_data_dir.py \
            webui/api/__tests__/test_monthly_user_posts_months.py \
            webui/api/__tests__/test_admin_static.py \
            webui/api/tests/test_catalog_updater.py \
            -q -n auto --dist loadfile \
            --deselect tests/fetch/test_reddit.py::TestThreadOverrides::test_search_threads_with_overrides_integration \
            --deselect tests/fetch/test_reddit.py::TestThreadOverrides::test_search_threads_with_overrides_deduplication \
            --deselect tests/fetch/test_reddit.py::TestThreadOverrides::test_search_threads_applies_excludes \
            --deselect tests/fetch/test_reddit.py::TestThreadOverrides::test_search_threads_exclude_wins_over_include \
            --deselect tests/integration/test_brush_validation_counting_integration.py::TestBrushValidationCountingIntegration::test_mathematical_relationships_integration \
            --deselect tests/integration/test_brush_validation_counting_integration.py::TestBrushValidationCountingIntegration::test_case_insensitive_grouping_integration \
            --deselect tests/integration/test_brush_validation_counting_integration.py::TestBrushValidationCountingIntegration::test_strategy_distribution_integration \
            --deselect tests/integration/test_brush_validation_counting_integration.py::TestBrushValidationCountingIntegration::test_performance_integration \
            --deselect tests/integration/test_brush_validation_counting_integration.py::TestBrushValidationCountingIntegration::test_complete_workflow_integration \
            --deselect tests/webui/api/production_tests/test_analysis_split_brush_removal.py::TestAnalysisAPISplitBrushRemoval::test_analyze_mismatch_response_without_split_brush \
            --deselect tests/webui/api/production_tests/test_analysis_split_brush_removal.py::TestAnalysisAPISplitBrushRemoval::test_brush_field_processing_without_split_brush \
            --deselect tests/webui/api/production_tests/test_analysis_split_brush_removal.py::TestAnalysisAPISplitBrushRemoval::test_non_brush_field_processing \
            --deselect tests/webui/api/production_tests/test_monthly_user_posts.py::TestMonthlyUserPostsAPI::test_get_users_for_month_with_search \
            --deselect tests/webui/api/production_tests/test_monthly_user_posts.py::TestMonthlyUserPostsAPI::test_get_user_posting_analysis_success \
            --deselect tests/webui/api/production_tests/test_monthly_user_posts.py::TestMonthlyUserPostsAPI::test_get_user_posting_analysis_user_not_found \
            --deselect tests/match/test_brush_matcher_optimization.py::TestBrushMatcherOptimization::test_performance_improvement \
            --deselect tests/performance/test_tier_delta_performance.py::TestTierDeltaPerformance::test_optimization_impact \
            --deselect tests/match/test_pattern_cache_performance.py::test_brush_matcher_initialization_performance \
            --deselect tests/match/brush/strategies/test_structure_preservation_tdd.py::TestStructurePreservationTDD::test_composite_brush_structure_preservation \
            --deselect tests/match/brush/strategies/test_structure_preservation_tdd.py::TestStructurePreservationTDD::test_summer_break_soaps_structure_preservation \
            --deselect tests/match/brush/strategies/test_structure_preservation_tdd.py::TestStructurePreservationTDD::test_simpson_chubby_2_complete_brush_rehydration \
            --deselect tests/match/brush/strategies/test_structure_preservation_tdd.py::TestStructurePreservationTDD::test_bfm_complex_complete_brush_rehydration \
            --deselect tests/match/test_validate_correct_matches_bypass.py::TestValidateCorrectMatchesBypass::test_test_brush_pattern_bypass_validation \
            --deselect tests/match/test_validate_correct_matches_bypass.py::TestValidateCorrectMatchesBypass::test_validate_field_brush_bypass \
            --deselect tests/match/test_webui_api_bypass_fix.py::test_webui_api_bypass_issue \
            --deselect tests/match/test_webui_api_bypass_fix.py::test_correct_bypass_approach
      # CI-runner-contention deselects (pass locally incl. this exact command; fail
      # under GitHub 2-core load — timing assertions and _yaml_catalog_cache-shared
      # structure tests. Same class as the timing deselects above; the pytest
      # markers workstream is the proper long-term home for this split.)
      - name: React tests
        working-directory: webui
        run: |
          npm ci
          npx eslint src/public vite.config.public.ts --ext ts,tsx --report-unused-disable-directives --max-warnings 0
          npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/Dockerfile.public-api
          push: true
          tags: |
            ghcr.io/nmrs/sotd-pipeline-public-api:latest
            ghcr.io/nmrs/sotd-pipeline-public-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/Dockerfile.public-frontend
          push: true
          tags: |
            ghcr.io/nmrs/sotd-pipeline-public-frontend:latest
            ghcr.io/nmrs/sotd-pipeline-public-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/Dockerfile.admin
          push: true
          tags: |
            ghcr.io/nmrs/sotd-pipeline-admin:latest
            ghcr.io/nmrs/sotd-pipeline-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: redeploy public stack (Komodo webhook)
        env:
          WEBHOOK: ${{ secrets.KOMODO_WEBHOOK_PUBLIC }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "KOMODO_WEBHOOK_PUBLIC not set — skipping"; exit 0; fi
          body='{"ref":"refs/heads/master"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | awk '{print $NF}')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body" "$WEBHOOK" || echo 000)
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error:: Komodo webhook returned HTTP $code"; exit 1
          fi
      # sotd-admin stack is not deployed anywhere; its webhook step is left
      # Portainer-shaped for whenever that changes.
      - name: redeploy admin stack (webhook)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_ADMIN }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -fsS -X POST "$WEBHOOK"
          else
            echo "PORTAINER_WEBHOOK_ADMIN not set — skipping redeploy"
          fi
