# SOTD metrics stack — Prometheus + Grafana scraping the nightly pipeline
# supervisor (deploy/compose-sotd-pipeline.yml) on the shared metrics-net.
# Deployed via Portainer gitops (source: this repo). Provisioned config and
# dashboards live under deploy/metrics/ and are bind-mounted read-only.
#
# Access is LAN-only by topology: nothing routes sotd-metrics through the
# Cloudflare tunnel or NPM, so the published ports are reachable from the LAN
# (http://<nas>:3000 Grafana / :9090 Prometheus) and nowhere else.
#
# NOTE: do NOT set a `cpus:` limit — Synology's cgroup v1 rejects it.
name: sotd-metrics

services:
  sotd-prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - /volume1/docker/sotd-metrics/prometheus:/prometheus
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - metrics-net

  sotd-grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${SOTD_GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - /volume1/docker/sotd-metrics/grafana:/var/lib/grafana
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - metrics-net

networks:
  metrics-net:
    external: true